---
layout: default
title: Photography
---
<h1>{{ page.title }}</h1>
<p>Taking photographs as I walk.</p>

<ul class="photos">
  {% for post in site.categories.photography %}
    <li>
      <a href="{{ post.url }}" title="{{ post.title }}">{{ post.title }}</a>, <em>{{ post.date | date_to_string }}</em>
    </li>
  {% endfor %}
</ul>

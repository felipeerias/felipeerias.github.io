<script type="text/markdown" id="lop-script">
## 1. The (Updated!) Life of a Pixel

This is one pixel, magnified until you can see the three tiny lights inside it: red, green and blue. Mixed at these strengths, they glow pink. Where did that pink come from? That's what this talk is about.

## 2. One of millions

Zoom out, and our pixel is part of the letter H, in a heading, on an ordinary web page. A 4K screen has more than eight million pixels like it, and the browser may redraw them sixty or more times a second.

## 3. It starts as text

Before there are any pixels, there is only text. The browser receives HTML for structure, CSS for style and JavaScript for behavior, as bytes over the network. Somewhere in these few hundred bytes are the instructions for our pink pixel.

## 4. Processes and threads

The work is split across processes. The browser process handles the interface and the network. Each site gets its own renderer process, with a main thread, in green, and a compositor thread, in amber. The Viz process, in orange, draws with the GPU.

## 5. The pipeline

Here is the route our pixel takes. The main thread parses, styles, lays out and paints: that's the paper side. Commit hands the work to the compositor, and Viz turns it into light. Animate and scroll can run on either thread.

## 6. Tokenize

First, the bytes are decoded into characters, here as UTF-8. Then the tokenizer, a state machine defined by the HTML standard, walks through them and emits tokens: a start tag with its attributes, some text, an end tag.

## 7. Build the DOM

The tree builder turns tokens into nodes. A start tag opens an element, an end tag closes it, and whatever arrives in between becomes its children. The result is the DOM, the Document Object Model: a tree of every element and every run of text.

## 8. The DOM is an API

The DOM isn't just the parser's output; it's a live API. Our script creates a badge and appends it to the body. Rendering follows the DOM, not the HTML. And since scripts share the main thread with rendering, long scripts delay frames.

## 9. Match selectors

Style begins by matching selectors to elements. Rules are sorted into buckets by their rightmost part, so each element only checks a few candidates. A selector like `body .hero` is read right to left: first `.hero`, then its ancestors.

## 10. Resolve the cascade

When several rules set the same property, the cascade picks one winner: origin and importance first, then cascade layers, then specificity, then order of appearance. Here `.hero` beats `h1` on specificity, so the heading is pink. That's our pixel's color.

## 11. Computed style

The result is a computed style for every element: a value for every CSS property, with relative values like 4rem or 0.67em turned into pixels. Blink keeps these in `ComputedStyle` objects, and shares the parts that are identical.

## 12. The layout tree

Layout works on its own tree. Elements that aren't displayed, like `head`, get no layout object. And some boxes appear that aren't in the DOM, like the anonymous block that wraps our inline image and iframe.

## 13. Boxes and constraints

Layout is a conversation. Parents tell children how much space they have: the constraint space. Children lay themselves out and report their size, and the parent positions them. Widths flow down, heights flow up. Reading sizes from script right after a change forces layout early.

## 14. Lines of text

Text needs extra care. Shaping, done by HarfBuzz, turns characters into glyphs from the font, each with an exact position. Then the line breaker finds where lines may break, and fills each line up to the available width.

## 15. The fragment tree

The output of layout is the fragment tree: every box and line, with its final size and position. Fragments are immutable, so they can be cached and reused. One layout object can even produce several fragments, when content splits across columns or pages.

## 16. Property trees

Pre-paint walks the tree and builds four property trees: transforms, clips, effects like opacity, and scrolling. Each piece of content just points at its nodes. So a transform or opacity change can update one node instead of redoing layout and paint.

## 17. Paint order

Paint decides the order things are drawn. Within a stacking context: backgrounds first, then floats, then inline content like text, then outlines. An element with a z-index forms its own stacking context, painted as a unit, and compared only with its siblings.

## 18. The display list

Paint doesn't produce pixels. It records a display list: commands like "draw this rectangle" or "draw these glyphs", grouped into chunks that share the same property tree state. Our pixel's glyph is inside one of these commands.

## 19. Commit

Now the main thread hands off. Commit copies the display list and the property trees to the compositor thread. After that, the main thread is free to run JavaScript again, while the compositor carries on in parallel. From here on, it's light.

## 20. Layerize

Layerize splits the display list into composited layers: pieces the compositor can raster and move on their own. Most content shares one layer. The map shows this step on the compositor thread; today Chromium still runs it on the main thread, just before commit.

## 21. Why some things get layers

Why a layer of its own? Fixed elements move differently when you scroll. Transform and opacity animations can run on the compositor, without the main thread. `will-change` asks for a layer ahead of time. But every layer costs memory, so use them deliberately.

## 22. Tiles

Layers aren't rastered all at once. The compositor cuts them into tiles and prioritizes them: tiles in the viewport now, tiles you're about to scroll to soon, the rest eventually. That's how huge pages stay fast and fit in memory.

## 23. Raster

Raster turns commands into pixels. The compositor sends each tile's work to the Viz process, where Skia, Chrome's graphics library, draws it on the GPU. Images are decoded along the way. This is where our pixel first turns pink.

## 24. Activate

The compositor keeps two trees: a pending tree, where the new commit gets rastered, and an active tree, which is what's on screen. Only when the pending tree's visible tiles are ready does it activate, so you never see half a frame.

## 25. Compositor frames

To show the active tree, the compositor builds a compositor frame: a list of quads, rectangles that say "draw this tile here", grouped into render passes. Effects like a blur get a render pass of their own. The frame is sent to Viz.

## 26. Aggregate

Viz receives frames from many producers: the browser interface, our page, and the cross-site iframe, which runs in its own renderer process. Our page's frame just leaves a slot that says "the iframe goes here". Aggregation stitches them into one frame.

## 27. Draw

Finally, Viz draws. On the GPU, it runs through the aggregated frame and fills a buffer with pixels. At the next display refresh, that buffer is presented, and the screen lights up.

## 28. Back to our pixel

And here we are again. Our pixel is pink because the `.hero` rule won the cascade, because the H glyph covers it, because Skia rastered that glyph into a tile, and because Viz drew that tile on the screen.

## 29. The whole journey

This is the whole journey. On the main thread, text became the DOM, styles, fragments, property trees and a display list. Off the main thread, it became layers, tiles and compositor frames. Then Viz drew the pixels. Every frame, for millions of pixels.

## 30. Thank you and questions

Thank you. This talk builds on Steve Kobes' original Life of a Pixel; his slides are at bit.ly/lifeofapixel. I'm happy to take questions.
</script>

/* An indented tree row: a pencil box with a connector to its parent's spine. */
function treeRow(parent, x0, y0, rp, ind, row, label, depth, o) {
  o = o || {};
  const size = o.size || 18, x = x0 + depth * ind, y = y0 + row * rp, bh = o.bh || 34;
  const w = o.w || Math.max(60, label.length * size * MONO_ADV + 26);
  const ng = g(parent);
  const pen = { roughness: 0.55, strokeWidth: o.sw || 1.5, stroke: o.stroke || C.lead };
  if (o.dash) pen.strokeLineDash = [7, 6];
  const box = P.rect(ng, x, y, w, bh, pen);
  const t = mtxt(ng, x + 13, y + bh / 2 + size * 0.36, label, { size: size, fill: o.fill || C.lead });
  let conn = null;
  if (depth > 0 && !o.noConn) conn = P.poly(ng, [[x0 + (depth - 1) * ind + 18, y - rp + bh + 2], [x0 + (depth - 1) * ind + 18, y + bh / 2], [x - 2, y + bh / 2]], { roughness: 0.3, strokeWidth: 1.1, stroke: C.leadMid });
  return { strokes: (conn ? conn.strokes : []).concat(box.strokes), t: t, x: x, y: y, w: w, h: bh };
}

(function buildLayers() {
  const grp = g(gLight);

    { key: 'root', label: 'root layer', why: ['everything else', 'shares this one'], rect: [0, 0, LW, LH] },
    { key: 'img', label: 'img', why: ['will-change: transform', 'asked for its own layer'], rect: [...loc(PAGE.img.x, PAGE.img.y), PAGE.img.w * s, PAGE.img.h * s] },

    { key: 'badge', label: 'badge', why: ['its opacity animation runs', 'on the compositor thread'], rect: [...loc(PAGE.badge.x, PAGE.badge.y), PAGE.badge.w * s, PAGE.badge.h * s] },
    { key: 'header', label: 'fixed header', why: ['stays put while', 'the page scrolls'], rect: [0, 0, LW, 16] }
  ];
  LYR.layers = LYR.defs.map((d, i) => {
    const lg = g(grp);
    /* every layer is a full sheet; only its own content is drawn on it */
    if (d.key !== 'root') el('rect', { x: 0, y: 0, width: LW, height: LH, fill: '#1a1406', 'fill-opacity': 0.08, stroke: C.comp, 'stroke-width': 1.2, 'stroke-opacity': 0.4 }, lg);
    const inner = g(lg);
    const [rx, ry, rw, rh] = d.rect;
    if (d.key === 'root') {
      el('rect', { x: 0, y: 0, width: LW, height: LH, fill: '#ffffff' }, inner);
      const hp = loc(PAGE.h1.x, PAGE.h1.base);
      stext(inner, hp[0], hp[1], PAGE.h1.text, { cls: 'page', size: PAGE.h1.size * s, weight: 700, fill: C.pink });
      PAGE.p.lines.forEach((ln, k) => { const q = loc(PAGE.p.x, PAGE.p.y + 15 + k * 19); stext(inner, q[0], q[1], ln, { cls: 'page', size: 16 * s, fill: PAGE.text }); });

    else if (d.key === 'badge') { const B = PAGE.badge; el('rect', { x: rx, y: ry, width: rw, height: rh, rx: B.r * s, fill: B.bg }, inner); stext(inner, rx + B.pad * s, ry + 17 * s, B.text, { cls: 'page', size: 16 * s, fill: B.fg }); }

    const edge = el('path', { d: rrPath(rx, ry, rw, rh, 0), fill: 'none', stroke: C.comp, 'stroke-width': 2, 'stroke-opacity': 0 }, lg);
    return { g: lg, inner: inner, edge: edge, d: d };
  });
  /* exploded pose: an axonometric stack; flat pose: the page as drawn */
  const ex = (i) => ({ a: 0.84, b: 0.2, c: -0.5, d: 0.5, e: 7930 + i * 30, f: 5860 - i * 92 });

  let last = -1;
  addRenderer(() => {
    const u = LYR.pose.u;
    if (u === last) return;
    last = u;
    const k = u * u * (3 - 2 * u);
    LYR.layers.forEach((ly, i) => {

  hide(LYR.cost);

  fadeIn(END.tagVsync, t + 3.15, 0.3);
  titleIn(26, t + 1.6);
};
SC[28] = t => {
  titleOut(26, t);
  fadeOut(END.tagVsync, t, 0.3);
  camTo(PIXHUD.cam0, t + 0.2, 3.2, { anchor: PIX, ease: E.zoom, glide: u => smooth(0, 0.7, u) });
  fadeIn(PIXHUD.ret, t + 0.3, 0.3);
  fadeOut(PIXHUD.ret, t + 1.9, 0.3);
  fadeIn(PIXHUD.rgb, t + 3.1, 0.3);
  END.why.forEach((w, i) => fadeIn(w, t + 3.15 + i * 0.1, 0.3));
  titleIn(27, t + 3.0);
};
SC[29] = t => {
  titleOut(27, t);
  hudOff(t);
  fadeOut(END.why.concat([PIXHUD.rgb]), t, 0.3);
  camTo(OVERVIEW, t + 0.15, 3.3, { anchor: PIX, ease: E.zoom, glide: u => smooth(0.1, 1, u) });
  tl.set(RT.legend, { autoAlpha: 0 }, t);           /* the legend returns last, as the overview settles */
  fadeIn(gRoute, t + 1.6, 0.7);
  fadeIn(RT.legend, t + 2.6, 0.5);
  fadeIn(PIXHUD.ret, t + 1.6, 0.4);
  RT.stations.forEach((s, i) => { if (s.prod) fadeIn(s.prod, t + 2.2 + i * 0.07, 0.35); });
  tl.to(RT.dot, { opacity: 1, duration: 0.2 }, t + 2.0);
  tl.to(RT.prox, { u: 1, duration: 1.7, ease: 'power1.inOut' }, t + 2.0);
  titleIn(28, t + 2.4);
};
SC[30] = t => {
  titleOut(28, t);
  fadeOut(PIXHUD.ret, t, 0.3);
  fadeIn(END.dim, t + 0.2, 0.8);
  titleIn(29, t + 0.7, { dur: 0.8, stagger: 0.03, restAt: 0.5 });
  fadeIn(creditEl, t + 1.5, 0.6);
};

/* =====================================================================
   6. TIMELINE ASSEMBLY, in scene order. Labels s0..s29 are the resting
   states of scenes 1..30. Each block below is the transition INTO that
   scene: it starts at the previous label and ends at its own label.
   ===================================================================== */
measureWritables();
const LABELS = [];
let T = 0;
function scene(n, dur, build) {
  const t0 = T;
  build(t0);
  T = t0 + dur;
  if (tl.duration() > T + 1e-3) console.warn('scene ' + n + ' overruns its label by ' + (tl.duration() - T).toFixed(3) + 's');
  tl.set({}, {}, T);                 /* labels do not extend a timeline; this does */
  tl.addLabel('s' + (n - 1), T);
  LABELS[n - 1] = T;
}
/* Mode helper: the dark-mode HUD readout is only for light scenes. */
function hudOn(at) { tl.to(hudRead.node, { autoAlpha: 1, duration: 0.5, ease: E.out }, at); }
function hudOff(at) { tl.to(hudRead.node, { autoAlpha: 0, duration: 0.35, ease: E.in }, at); }


/* ---- Intro and scene 1: the pixel ---- */
camStart(PIXHUD.cam0);
const bloom = g(MON.g);
const bloomHalo = el('rect', { x: PIX.x - PX_UNIT, y: PIX.y - PX_UNIT, width: 2 * PX_UNIT, height: 2 * PX_UNIT, rx: PX_UNIT, fill: C.pink, opacity: 0.25 }, bloom);
const bloomSq = el('rect', { x: PIX.x - PX_UNIT / 2, y: PIX.y - PX_UNIT / 2, width: PX_UNIT, height: PX_UNIT, fill: C.pink }, bloom);
gsap.set([bloomHalo, bloomSq], { scale: 0.02, transformOrigin: '50% 50%' });
gsap.set(MON.lit, { autoAlpha: 0 });
scene(1, 3.6, t => {
  tl.to(bloomSq, { scale: 1, duration: 1.0, ease: 'expo.out' }, t + 0.25);
  tl.to(bloomHalo, { scale: 1.6, opacity: 0.12, duration: 1.3, ease: 'expo.out' }, t + 0.25);
  tl.to(MON.lit, { autoAlpha: 1, duration: 0.7, ease: E.soft }, t + 1.15);
  tl.to([bloomSq, bloomHalo], { opacity: 0, duration: 0.6, ease: E.soft }, t + 1.25);
  fadeIn(PIXHUD.rgb, t + 1.3, 0.3);
  tl.to(PIXHUD.rgbProx, { p: 1, duration: 0.7, ease: E.lin }, t + 1.3);
  PIXHUD.ch.forEach((c, k) => {
    fadeIn([c.t, c.bar], t + 1.55 + k * 0.12, 0.35);
    tl.to(c.fill, { scaleX: 1, duration: 0.6, ease: E.out }, t + 1.7 + k * 0.12);
  });
  titleIn(0, t + 1.8, { dur: 0.9, stagger: 0.026, restAt: 0.7 });
  fadeIn(PIXHUD.note, t + 2.9, 0.5);
});

/* ---- Scene 2: one of millions (anchored zoom out to the monitor) ---- */
scene(2, 3.8, t => {
  titleOut(0, t);
  fadeOut([PIXHUD.rgb, PIXHUD.note].concat(PIXHUD.ch.map(c => c.t), PIXHUD.ch.map(c => c.bar)), t, 0.35);
  camTo(F.mon, t + 0.15, 3.3, { anchor: PIX, ease: E.zoom, glide: u => smooth(0.25, 1, u) });
  hudOn(t + 0.4);
  fadeIn(PIXHUD.count, t + 0.5, 0.4);
  fadeIn(PIXHUD.ret, t + 1.35, 0.4);
  titleIn(1, t + 2.9);
});

/* ---- Scene 3: it starts as text (the long rewind to the source) ---- */
scene(3, 3.6, t => {
  titleOut(1, t);
  fadeOut([PIXHUD.count, PIXHUD.ret], t, 0.3);
  camTo(F.T, t + 0.1, 2.7, { rho: 1.35 });
  tl.to(MON.lit, { autoAlpha: 0, duration: 0.5, ease: E.soft }, t + 0.7);
  [SRC.html, SRC.css, SRC.js].forEach((p, i) => {
    const a = t + 1.7 + i * 0.16;
    draw(p.frame.strokes, a, 0.7);
    fadeIn([p.fill, p.bar, p.bytes], a + 0.2, 0.5);
    tl.to(p.tprox, { p: 1, duration: 0.55, ease: E.lin }, a + 0.1);
  });
  const rows = SRC.html.code.rows.concat(SRC.css.code.rows, SRC.js.code.rows);
  write(rows, t + 2.05, 0.32, 0.03);
  write(SRC.hex, t + 2.6, 0.6);
  draw(SRC.u1.strokes.concat(SRC.u2.strokes), t + 3.05, 0.45);
  titleIn(2, t + 2.5);
});

/* ---- Scene 4: processes and threads ---- */
scene(4, 3.2, t => {
  titleOut(2, t);
  camTo(F.P, t + 0.1, 1.7);
  [PROC.browser, PROC.renderer, PROC.viz].forEach((b, i) => {
    const a = t + 0.75 + i * 0.18;
    draw(b.fr.strokes, a, 0.7);
    fadeIn([b.fill, b.note], a + 0.25, 0.5);
    tl.to(b.tp, { p: 1, duration: 0.5, ease: E.lin }, a + 0.1);
  });
  drawEach(PROC.ghosts, t + 1.1, 0.6, 0.1);
  PROC.lanes.concat([PROC.io]).forEach((ln, i) => {
    const a = t + 1.45 + i * 0.1;
    draw(ln.edge.strokes, a, 0.5);
    fadeIn([ln.bar, ln.nm, ln.tk], a + 0.15, 0.45);
  });
  draw(PROC.wire.strokes, t + 2.05, 0.6);
  drawEach(PROC.drops, t + 2.2, 0.3, 0.08);
  fadeIn(PROC.wireLabels, t + 2.3, 0.4);
  tl.to(PROC.dot, { opacity: 1, duration: 0.15 }, t + 2.25);
  tl.to(PROC.dotProx, { x: L.P.cx + 780, duration: 0.8, ease: 'power1.in' }, t + 2.3);
  tl.to(PROC.dot, { opacity: 0, duration: 0.12 }, t + 3.05);
  titleIn(3, t + 1.3);
});

/* ---- Scene 5: the pipeline, drawn as a route over the whole world ---- */
scene(5, 3.6, t => {
  titleOut(3, t);
  hudOff(t);
  camTo(OVERVIEW, t + 0.1, 2.3);
  fadeIn(gPaper, t + 0.4, 0.7);
  fadeIn(gRoute, t + 1.1, 0.3);    /* once the paper is opaque */
  fadeIn(RT.legend, t + 1.3, 0.6);
  draw(RT.src.strokes, t + 1.1, 0.35, 0, E.lin);
  draw(RT.main.strokes, t + 1.4, 1.2, 0, E.lin);
  draw(RT.comp.strokes, t + 2.55, 0.5, 0, E.lin);
  draw(RT.viz.strokes, t + 3.0, 0.45, 0, E.lin);
  RT.stations.forEach((s, i) => {
    const a = i < 7 ? t + 1.5 + i * 0.15 : i === 7 ? t + 2.55 : t + 2.65 + (i - 8) * 0.12;
    draw(s.ring.strokes, a, 0.35);
    fadeIn(s.label, a + 0.1, 0.35);
  });
  titleIn(4, t + 2.4);
});

/* ---- Scenes 6 to 8: Parse (paper) ---- */
scene(6, 4.0, SC[6]);   /* Tokenize: bytes, characters, tokens */
scene(7, 3.5, SC[7]);   /* Build the DOM: tree builder and open elements */
scene(8, 3.6, SC[8]);   /* The DOM is an API: script edits the tree */

/* ---- Scenes 9 to 11: Style (paper) ---- */
scene(9, 4.0, SC[9]);   /* Match selectors: buckets, candidates, right to left */
scene(10, 3.6, SC[10]); /* Resolve the cascade: criteria in order */
scene(11, 3.4, SC[11]); /* Computed style: absolute values, shared groups */

/* ---- Scenes 12 to 15: Layout (paper) ---- */
scene(12, 4.0, SC[12]); /* The layout tree: no box for head; anonymous block */
scene(13, 3.6, SC[13]); /* Boxes and constraints: widths down, heights up */
scene(14, 3.5, SC[14]); /* Lines of text: shaping and line breaking */
scene(15, 3.4, SC[15]); /* The fragment tree: final geometry, immutable */

/* ---- Scenes 16 to 18: Paint (paper) ---- */
scene(16, 4.0, SC[16]); /* Property trees: transform, clip, effect, scroll */
scene(17, 3.5, SC[17]); /* Paint order: phases within a stacking context */
scene(18, 3.6, SC[18]); /* The display list: ops in chunks by state */

/* ---- Scenes 19 to 21: the handoff and composited layers ---- */
scene(19, 3.2, SC[19]); /* Commit: across the paper edge */
scene(20, 3.2, SC[20]); /* Layerize: the page splits into layers */
scene(21, 3.0, SC[21]); /* Why some things get layers */

/* ---- Scenes 22 to 24: tiles, raster, activate ---- */
scene(22, 3.4, SC[22]); /* Tiles: priorities NOW, SOON, EVENTUALLY */
scene(23, 3.0, SC[23]); /* Raster: Skia on the GPU, image decode */
scene(24, 3.0, SC[24]); /* Activate: pending tree becomes active */

/* ---- Scenes 25 to 27: frames, aggregation, draw ---- */
scene(25, 3.4, SC[25]); /* Compositor frames: quads and render passes */
scene(26, 3.1, SC[26]); /* Aggregate: every producer's frame becomes one */
scene(27, 3.6, SC[27]); /* Draw: the screen lights up again */

/* ---- Scenes 28 to 30: the ending ---- */
scene(28, 3.9, SC[28]); /* Back to our pixel: anchored zoom in */
scene(29, 3.9, SC[29]); /* The whole journey: anchored zoom out, products */
scene(30, 2.4, SC[30]); /* Thank you and questions, with the credit */

/* =====================================================================
   7. NAVIGATION AND CONTROLS
   ===================================================================== */
/* ---------- The script: Markdown from the block at the top ---------- */
function mdInline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function parseScript(src) {
  const out = [], blocks = [];
  let cur = null;
  src.split(/\r?\n/).forEach(line => {
    const m = /^#{1,6}\s+(\d+)?[.)]?\s*(.*)$/.exec(line);
    if (m) { cur = { n: m[1] ? +m[1] : null, lines: [] }; blocks.push(cur); }
    else if (cur) cur.lines.push(line);
  });
  blocks.forEach((b, i) => {
    const n = b.n || (i + 1);
    const paras = b.lines.join('\n').trim().split(/\n\s*\n/).map(p => p.replace(/\s*\n\s*/g, ' ').trim()).filter(Boolean);
    out[n - 1] = { html: paras.map(p => '<p>' + mdInline(p) + '</p>').join(''), text: paras.join(' ').replace(/[`*]/g, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1') };
  });
  return out;
}
const SCRIPT = parseScript(($('lop-script') || { textContent: '' }).textContent);
const scriptOf = i => SCRIPT[i] || { html: '', text: '' };

const appEl = $('app'), viewportEl = $('viewport'), stageEl = $('stage');
const panelEl = $('scriptPanel'), scriptTextEl = $('scriptText'), measureEl = $('measure');
const btnPrev = $('btnPrev'), btnNext = $('btnNext'), btnScript = $('btnScript');
const counterEl = $('counter'), chapterEl = $('chapter'), liveEl = $('live'), ticksEl = $('ticks');

/* ---------- Progress ticks, grouped by chapter ---------- */
const groups = [];
SCENES.forEach((s, i) => {
  let gr = groups[groups.length - 1];
  if (!gr || gr.name !== s.chapter) { gr = { name: s.chapter, idx: [] }; groups.push(gr); }
  gr.idx.push(i);
});
const tickBtns = [];
groups.forEach(gr => {
  const box = document.createElement('div'); box.className = 'grp';
  const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = gr.name;
  const row = document.createElement('div'); row.className = 'row';
  box.appendChild(lbl); box.appendChild(row); ticksEl.appendChild(box);
  gr.box = box;
  gr.idx.forEach(i => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tick';
    b.style.setProperty('--c', TICK[SCENES[i].tick]);
    b.setAttribute('aria-label', 'Scene ' + (i + 1) + ': ' + SCENES[i].title);
    b.title = (i + 1) + '. ' + SCENES[i].title;
    b.innerHTML = '<i></i>';
    b.addEventListener('click', () => go(i));
    row.appendChild(b);
    tickBtns[i] = b;
  });
});

/* ---------- Layout: stage, script panel (bottom or side), never overlapping ---------- */
let scriptOn = true;
try { if (localStorage.getItem('lop-script') === 'off') scriptOn = false; } catch (e) { /* storage unavailable */ }
const mCache = {};
function maxScriptHeight(width, fs) {
  const key = width + '|' + fs;
  if (mCache[key]) return mCache[key];
  measureEl.style.cssText = 'position:absolute; left:-9999px; top:0; visibility:hidden; width:' + width + 'px; font-size:' + fs + 'px;';
  measureEl.className = '';
  let m = 0;
  for (let i = 0; i < COUNT; i++) {
    measureEl.innerHTML = '<div id="scriptPanelM" style="padding:16px 22px 18px 20px; border-left:3px solid transparent; line-height:1.52; font-family:var(--f-hand); font-variation-settings:\'INFM\' 0">' + scriptOf(i).html + '</div>';
    measureEl.querySelectorAll('p').forEach(p => { p.style.margin = '0 0 .6em'; p.style.maxWidth = '72ch'; });
    const last = measureEl.querySelector('p:last-child'); if (last) last.style.marginBottom = '0';
    m = Math.max(m, measureEl.firstChild.offsetHeight);
  }
  measureEl.innerHTML = '';
  return (mCache[key] = m);
}
function layout(animate) {
  const aw = appEl.clientWidth, ah = appEl.clientHeight;
  if (!aw || !ah) return;
  const gap = 8;
  const fs = Math.round(clamp(Math.min(aw / 62, ah / 36), 14, 21));
  let s = Math.min(aw / W, ah / H), mode = 'none', pw = 0, ph = 0;
  if (scriptOn) {
    /* Option A: under the stage. */
    const guess = Math.min(aw / W, ah * 0.8 / H);
    const need = maxScriptHeight(Math.round(W * guess), fs);
    const hB = Math.min(need, Math.round(ah * 0.38));
    const sB = Math.min(aw / W, (ah - hB - gap) / H);
    /* Option B: beside the stage. */
    const wR = Math.round(clamp(aw * 0.3, 240, 460));
    const sR = Math.min((aw - wR - gap) / W, ah / H);
    if (sB >= sR * 0.98) { mode = 'bottom'; s = sB; ph = hB; }
    else { mode = 'right'; s = sR; pw = wR; }
  }
  const sw = W * s, sh = H * s;
  let sx, sy;
  if (mode === 'bottom') { sx = (aw - sw) / 2; sy = Math.max(0, (ah - sh - ph - gap) / 2); }
  else if (mode === 'right') { sx = Math.max(0, (aw - sw - pw - gap) / 2); sy = (ah - sh) / 2; }
  else { sx = (aw - sw) / 2; sy = (ah - sh) / 2; }
  viewportEl.classList.toggle('anim', !!animate);
  viewportEl.style.transform = 'translate(' + fmt(sx, 2) + 'px,' + fmt(sy, 2) + 'px) scale(' + s.toFixed(5) + ')';
  panelEl.style.fontSize = fs + 'px';
  if (mode === 'bottom') {
    Object.assign(panelEl.style, { left: fmt(sx, 1) + 'px', top: fmt(sy + sh + gap, 1) + 'px', width: fmt(sw, 1) + 'px', height: ph + 'px' });
  } else if (mode === 'right') {
    Object.assign(panelEl.style, { left: fmt(sx + sw + gap, 1) + 'px', top: fmt(sy, 1) + 'px', width: pw + 'px', height: fmt(sh, 1) + 'px' });
  }
  panelEl.classList.toggle('off', mode === 'none');
  panelEl.dataset.mode = mode;
  updateMore();
}
function updateMore() { panelEl.classList.toggle('more', panelEl.scrollTop + panelEl.clientHeight < panelEl.scrollHeight - 2); }
panelEl.addEventListener('scroll', updateMore, { passive: true });
function setScript(on) {
  scriptOn = on;
  btnScript.setAttribute('aria-pressed', on ? 'true' : 'false');
  try { localStorage.setItem('lop-script', on ? 'on' : 'off'); } catch (e) { /* storage unavailable */ }
  layout(true);
}
btnScript.addEventListener('click', () => setScript(!scriptOn));
let rT = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rT); rT = requestAnimationFrame(() => layout(false)); });

/* ---------- Scene state ---------- */
let cur = 0, navTween = null, fadeTween = null, swapTimer = 0, firstUI = true, busy = false;
const done = () => { busy = false; };
function updateUI() {
  const s = SCENES[cur], sc = scriptOf(cur);
  counterEl.textContent = String(cur + 1).padStart(2, '0') + ' / ' + COUNT;
  chapterEl.textContent = s.chapter;
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === COUNT - 1;
  tickBtns.forEach((b, i) => {
    b.classList.toggle('now', i === cur);
    b.classList.toggle('past', i < cur);
    if (i === cur) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
  groups.forEach(gr => gr.box.classList.toggle('on', gr.idx.indexOf(cur) >= 0));
  panelEl.style.setProperty('--thread', TICK[s.tick]);
  clearTimeout(swapTimer);
  if (firstUI) { scriptTextEl.innerHTML = sc.html; firstUI = false; updateMore(); }
  else {
    scriptTextEl.classList.add('swap');
    swapTimer = setTimeout(() => { scriptTextEl.innerHTML = sc.html; panelEl.scrollTop = 0; scriptTextEl.classList.remove('swap'); updateMore(); }, 200);
  }
  liveEl.textContent = 'Scene ' + (cur + 1) + ' of ' + COUNT + ': ' + s.title + '. ' + sc.text;
  try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) { /* sandboxed */ }
}
function sceneAtTime(t) {
  let k = 0;
  for (let i = 0; i < COUNT; i++) if (LABELS[i] <= t + 1e-4) k = i;
  const next = LABELS[k + 1];
  return next === undefined ? k : k + (t - LABELS[k]) / (next - LABELS[k]);
}
function seekTo(i) { tl.seek(LABELS[i], false); renderAll(); }
function go(i, instant) {
  i = clamp(i, 0, COUNT - 1);
  const wasMoving = busy;
  cur = i;
  updateUI();
  if (navTween) { navTween.kill(); navTween = null; }
  if (fadeTween) { fadeTween.kill(); fadeTween = null; }
  const target = LABELS[i], now = tl.time();
  busy = false;
  if (instant || reduceMotion) { gsap.set(stageEl, { opacity: 1 }); seekTo(i); return; }
  if (Math.abs(sceneAtTime(now) - i) > 2.001) {
    /* Long jumps fade and cut instead of fast-forwarding. */
    fadeTween = gsap.timeline()
      .to(stageEl, { opacity: 0, duration: 0.2, ease: 'power1.in' })
      .add(() => seekTo(i))
      .to(stageEl, { opacity: 1, duration: 0.4, ease: 'power1.out', onComplete: done });
    busy = true;
    return;
  }
  gsap.to(stageEl, { opacity: 1, duration: 0.2, overwrite: true });
  const dist = Math.abs(target - now);
  if (dist < 1e-4) return;
  const back = target < now;
  let dur = back ? dist * 0.72 : dist;
  if (wasMoving) dur *= 0.6;
  busy = true;
  navTween = tl.tweenTo(target, { duration: dur, ease: 'none', onComplete: done });
}
btnPrev.addEventListener('click', () => go(cur - 1));
btnNext.addEventListener('click', () => go(cur + 1));
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const onButton = e.target && (e.target.tagName === 'BUTTON' || e.target.tagName === 'A');
  switch (e.key) {
    case 'ArrowRight': case 'ArrowDown': case 'PageDown':
      e.preventDefault(); go(cur + 1); break;
    case ' ': case 'Enter':
      if (onButton) return;              /* the focused control handles it */
      e.preventDefault(); go(cur + 1); break;
    case 'ArrowLeft': case 'ArrowUp': case 'PageUp':
      e.preventDefault(); go(cur - 1); break;
    case 'Home': e.preventDefault(); go(0); break;
    case 'End': e.preventDefault(); go(COUNT - 1); break;
    case 's': case 'S': setScript(!scriptOn); break;
  }
});
window.addEventListener('hashchange', () => {
  const n = parseInt((location.hash || '').slice(1), 10);
  if (n >= 1 && n <= COUNT && n - 1 !== cur) go(n - 1);
});

/* ---------- Boot ---------- */
gsap.ticker.add(renderAll);
btnScript.setAttribute('aria-pressed', scriptOn ? 'true' : 'false');
layout(false);
const fromHash = parseInt((location.hash || '').slice(1), 10);
if (fromHash >= 2 && fromHash <= COUNT) go(fromHash - 1, true);
else {
  cur = 0; updateUI();
  tl.seek(0, false); renderAll();
  if (reduceMotion) seekTo(0); else { busy = true; navTween = tl.tweenTo(LABELS[0], { duration: LABELS[0], ease: 'none', onComplete: done }); }
}
$('loading').classList.add('done');
window.__lop = {
  tl: tl, go: go, labels: LABELS, scenes: SCENES, renderAll: renderAll, layout: layout, setScript: setScript,
  get cur() { return cur; }, get cam() { return CAM.cur; }, get moving() { return busy; },
  script: SCRIPT, mon: MON
};

})();
